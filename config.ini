; ============================================================================
;  DistVRT v5 (Python) - settings.   Edit only if the lab setup changes.
;  Every path below is built the same way DistVRT_v5.m builds it.
; ============================================================================

[paths]
; Folder that contains  stim\  and  data\  (the MATLAB experiment folder).
; Leave blank = the folder that holds this DistVRT_Python folder.
root =

; Where <ID>\Visit<N>\ folders go.
;   auto  (default) = use root\data\DistVRT_v5 if it exists (path in DistVRT_v5.m);
;                     else root\Data if participant folders are already directly inside it
;                     (the lab's Data folder: Data\2004\Visit1 ...); else root\data\DistVRT_v5.
;   or type a fixed path relative to root, e.g.  data_subdir = Data
data_subdir = auto

[audio]
; Matching is done by name, so Windows device numbers can change freely.
interface   = MOTU
output_name = Out 3-4
input_name  = In 1-2
samplerate  = 44100
blocksize   = 512

[calibration]
; Same constants as scale2SysCalSF.m and DistVRT_Integration.m (MATLAB folder, Jan 2026).
system_cal_rms  = 0.4
system_db_spl   = 80.75
; DistVRT_Integration.m:  targetSPLword  = word_base  - db_offset_apr - extra_atten
;                         targetSPLdist  = dist_base  - db_offset_apr - extra_atten
;                         targetSPLnoise = noise_base - extra_atten - SNR
db_offset_apr   = 12.5
extra_atten     = 5
word_base       = 66
dist_base       = 62.2
noise_base      = 57.9
